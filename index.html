<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>篮球战术板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#113311;display:flex;flex-direction:column;align-items:center;padding:8px;}
#court{background:#387838;border:3px solid #fff;}
.controls{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
button{
    padding:8px 14px;
    font-size:15px;
    border:none;
    border-radius:4px;
    background:#eee;
    cursor:pointer;
}
button:active{background:#ccc;}
</style>
</head>
<body>
<canvas id="court" width="1000" height="600"></canvas>
<div class="controls">
    <button id="resetAll">重置全员站位</button>
    <button id="clearLines">清空箭头</button>
    <button id="tact1">右侧挡拆</button>
    <button id="tact2">底线掩护</button>
    <button id="tact3">弧顶三分阵型</button>
</div>

<script>
const canvas = document.getElementById('court');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;
const centerX = W / 2;
const centerY = H / 2;

// 颜色
const WHITE = "#fff";
const RED = "#dc2222";
const BLUE = "#2222dc";
const ARROW_COLOR = "#20c020";
const SELECT_COLOR = "#ffdd00";

// 球员初始化：进攻红5人，防守蓝5人
let players = [
    {x:150,y:180,color:RED,originX:150,originY:180,r:18},
    {x:150,y:240,color:RED,originX:150,originY:240,r:18},
    {x:150,y:300,color:RED,originX:150,originY:300,r:18},
    {x:150,y:360,color:RED,originX:150,originY:360,r:18},
    {x:150,y:420,color:RED,originX:150,originY:420,r:18},

    {x:750,y:180,color:BLUE,originX:750,originY:180,r:18},
    {x:750,y:240,color:BLUE,originX:750,originY:240,r:18},
    {x:750,y:300,color:BLUE,originX:750,originY:300,r:18},
    {x:750,y:360,color:BLUE,originX:750,originY:360,r:18},
    {x:750,y:420,color:BLUE,originX:750,originY:420,r:18},
];
let selectedPlayer = null;
let dragStart = null;
let drawingLine = false;
let lines = [];
let currentLine = null;

// 绘制标准半场球场
function drawCourt(){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle="#387838";
    ctx.fillRect(0,0,W,H);

    // 外框
    ctx.strokeStyle=WHITE;
    ctx.lineWidth=3;
    ctx.strokeRect(40,40,W-80,H-80);

    // 中线
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(centerX,40);
    ctx.lineTo(centerX,H-40);
    ctx.stroke();

    // 中圈
    ctx.beginPath();
    ctx.arc(centerX, centerY, 80, 0, Math.PI*2);
    ctx.stroke();

    const hoopX = W - 40;
    const hoopY = centerY;
    const paintW = 160;
    const paintH = 80;
    // 三秒区矩形
    ctx.strokeRect(hoopX-paintW, hoopY-paintH/2, paintW, paintH);

    // 三分圆弧
    const threeR = 230;
    ctx.beginPath();
    ctx.arc(hoopX, hoopY, threeR, -Math.PI*62/180, Math.PI*62/180);
    ctx.stroke();

    // 篮筐小圆
    ctx.beginPath();
    ctx.arc(hoopX, hoopY, 23, 0, Math.PI*2);
    ctx.stroke();
}

// 绘制所有球员
function drawPlayers(){
    players.forEach(p=>{
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle = p.color;
        ctx.fill();
        ctx.strokeStyle = WHITE;
        ctx.lineWidth=2;
        ctx.stroke();

        // 选中高亮外圈
        if(selectedPlayer === p){
            ctx.beginPath();
            ctx.arc(p.x,p.y,p.r+4,0,Math.PI*2);
            ctx.strokeStyle=SELECT_COLOR;
            ctx.lineWidth=3;
            ctx.stroke();
        }
    })
}

// 绘制战术箭头线段
function drawLines(){
    ctx.strokeStyle=ARROW_COLOR;
    ctx.lineWidth=3;
    lines.forEach(seg=>{
        drawArrow(seg.sx,seg.sy,seg.ex,seg.ey);
    })
    if(currentLine){
        drawArrow(currentLine.sx,currentLine.sy,currentLine.ex,currentLine.ey);
    }
}
// 画箭头线段
function drawArrow(x1,y1,x2,y2){
    const headLen = 12;
    const angle = Math.atan2(y2-y1, x2-x1);
    ctx.beginPath();
    ctx.moveTo(x1,y1);
    ctx.lineTo(x2,y2);
    ctx.lineTo(
        x2 - headLen*Math.cos(angle-Math.PI/6),
        y2 - headLen*Math.sin(angle-Math.PI/6)
    );
    ctx.moveTo(x2,y2);
    ctx.lineTo(
        x2 - headLen*Math.cos(angle+Math.PI/6),
        y2 - headLen*Math.sin(angle+Math.PI/6)
    );
    ctx.stroke();
}

// 全局刷新
function render(){
    drawCourt();
    drawLines();
    drawPlayers();
}

// 判定点是否命中球员圆形
function getPlayerByPos(px,py){
    for(let p of players){
        let dx = px - p.x;
        let dy = py - p.y;
        if(dx*dx+dy*dy <= p.r*p.r) return p;
    }
    return null;
}

// 鼠标/触摸按下
function startAt(x,y){
    dragStart = {x,y};
    let p = getPlayerByPos(x,y);
    if(p){
        selectedPlayer = p;
        drawingLine = false;
    }else{
        selectedPlayer = null;
        drawingLine = true;
        currentLine = {sx:x, sy:y, ex:x, ey:y};
    }
}
// 拖动
function moveAt(x,y){
    if(selectedPlayer){
        selectedPlayer.x = x;
        selectedPlayer.y = y;
    }else if(drawingLine && currentLine){
        currentLine.ex = x;
        currentLine.ey = y;
    }
}
// 松开
function endAt(){
    if(drawingLine && currentLine){
        lines.push(currentLine);
        currentLine = null;
    }
    dragStart = null;
}

// 鼠标事件
canvas.addEventListener('mousedown',e=>{
    const rect = canvas.getBoundingClientRect();
    startAt(e.clientX-rect.left, e.clientY-rect.top);
})
canvas.addEventListener('mousemove',e=>{
    const rect = canvas.getBoundingClientRect();
    moveAt(e.clientX-rect.left, e.clientY-rect.top);
})
canvas.addEventListener('mouseup',endAt);
canvas.addEventListener('mouseleave',endAt);

// 触屏事件（手机）
canvas.addEventListener('touchstart',e=>{
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const t = e.touches[0];
    startAt(t.clientX-rect.left, t.clientY-rect.top);
})
canvas.addEventListener('touchmove',e=>{
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const t = e.touches[0];
    moveAt(t.clientX-rect.left, t.clientY-rect.top);
})
canvas.addEventListener('touchend',e=>{e.preventDefault();endAt()});

// 按钮功能
document.getElementById('resetAll').onclick = ()=>{
    players.forEach(p=>{
        p.x = p.originX;
        p.y = p.originY;
    })
    selectedPlayer = null;
}
document.getElementById('clearLines').onclick = ()=>{
    lines = [];
    currentLine = null;
}

// 三套预设战术
document.getElementById('tact1').onclick = ()=>{
    players[0].x=680;players[0].y=280;
    players[1].x=730;players[1].y=280;
}
document.getElementById('tact2').onclick = ()=>{
    players[0].x=820;players[0].y=120;
    players[1].x=820;players[1].y=480;
}
document.getElementById('tact3').onclick = ()=>{
    players[0].x=620;players[0].y=300;
    players[1].x=580;players[1].y=180;
    players[2].x=580;players[2].y=420;
}

// 循环渲染
function loop(){
    render();
    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
