<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>篮球战术板‑竖屏全屏</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
    background:#202020;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
}
#court{
    background:#398039;
    border:3px solid #fff;
    width:calc(100vw - 24px);
    max-width:760px;
    height:auto;
    aspect-ratio:560 / 1000;
}
.controls{
    margin:12px 8px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:center;
    width:calc(100vw - 24px);
    max-width:760px;
}
button{
    padding:9px 12px;
    font-size:14px;
    border:0;
    border-radius:6px;
    background:#eee;
    cursor:pointer;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
}
button:active{background:#bbbbbb}
/*只手机横屏才隐藏画布*/
@media screen and (max-width:768px) and (orientation: landscape) {
    body::before {
        content: "请竖屏使用";
        color:#fff;
        font-size:20px;
        margin-bottom:20px;
    }
    #court {
        display:none;
    }
}
</style>
</head>
<body>
<canvas id="court"></canvas>
<div class="controls">
    <button id="btnReset">重置全员站位</button>
    <button id="btnClearArrow">清空箭头</button>
    <button id="btnT1">右侧挡拆</button>
    <button id="btnT2">底线掩护</button>
    <button id="btnT3">弧顶三分</button>
</div>

<script>
const canvas = document.getElementById("court");
const ctx = canvas.getContext("2d");

//竖屏基准尺寸 宽560 高1000，篮筐在下方
const BASE_W = 560;
const BASE_H = 1000;

let scale = 1;

//球员基准坐标，竖屏布局
let playerBase = [
    {x:280,y:900,color:"red",num:1},
    {x:160,y:800,color:"red",num:2},
    {x:400,y:800,color:"red",num:3},
    {x:180,y:650,color:"red",num:4},
    {x:380,y:650,color:"red",num:5},

    {x:280,y:180,color:"blue",num:6},
    {x:160,y:280,color:"blue",num:7},
    {x:400,y:280,color:"blue",num:8},
    {x:180,y:430,color:"blue",num:9},
    {x:380,y:430,color:"blue",num:10},
];
let playerList=[];
const originBase = JSON.parse(JSON.stringify(playerBase));

let arrowStart = null;
let tempArrowEnd = null;
let savedArrows = [];
let dragTarget = null;


function resizeCanvas(){
    //手机全屏可用宽度，减去左右边距
    let maxW = window.innerWidth - 24;
    if(maxW>760) maxW=760;
    scale = maxW / BASE_W;

    canvas.width  = BASE_W * scale;
    canvas.height = BASE_H * scale;
    canvas.style.width = canvas.width +"px";
    canvas.style.height = canvas.height +"px";

    playerList = playerBase.map(p=>{
        return {
            x:p.x*scale,
            y:p.y*scale,
            color:p.color,
            num:p.num
        }
    })
    redraw();
}


function drawCourt() {
    const W = canvas.width;
    const H = canvas.height;

    ctx.fillStyle="#398039";
    ctx.fillRect(0,0,W,H);
    ctx.strokeStyle="#ffffff";
    ctx.lineWidth=2*scale;

    const margin = 25*scale;
    //外框
    ctx.strokeRect(margin, margin, W - margin*2, H - margin*2);
    //水平中线
    ctx.beginPath();
    ctx.moveTo(margin, H/2);
    ctx.lineTo(W - margin, H/2);
    ctx.stroke();
    //中圈
    ctx.beginPath();
    ctx.arc(W/2, H/2, 60*scale, 0, Math.PI*2);
    ctx.stroke();

    //篮筐：底部居中
    const hoopX = W / 2;
    const hoopY = H - margin;

    //罚球圈
    ctx.beginPath();
    ctx.arc(hoopX, hoopY, 80*scale, 0, Math.PI*2);
    ctx.stroke();

    //三分线，篮筐朝下，圆弧在上
    const threeR = 225 * scale;
    const angStart = (90 + 67) * Math.PI / 180;
    const angEnd   = (90 - 67) * Math.PI / 180;

    ctx.beginPath();
    ctx.arc(hoopX, hoopY, threeR, angStart, angEnd);
    ctx.stroke();

    let p1x = hoopX + threeR * Math.cos(angStart);
    let p1y = hoopY + threeR * Math.sin(angStart);
    let p2x = hoopX + threeR * Math.cos(angEnd);
    let p2y = hoopY + threeR * Math.sin(angEnd);

    //三分两条水平边线
    ctx.beginPath();
    ctx.moveTo(p1x, p1y);
    ctx.lineTo(W - margin, p1y);
    ctx.moveTo(p2x, p2y);
    ctx.lineTo(margin, p2y);
    ctx.stroke();

    //油漆区矩形
    ctx.strokeRect(hoopX - 80 * scale, H - margin - 160 * scale, 160 * scale, 160 * scale);
}

function drawArrowLine(p1,p2){
    ctx.beginPath();
    ctx.moveTo(p1.x,p1.y);
    ctx.lineTo(p2.x,p2.y);
    ctx.stroke();
    let ang = Math.atan2(p2.y-p1.y, p2.x-p1.x);
    const arrowLen=13*scale;
    ctx.beginPath();
    ctx.moveTo(p2.x,p2.y);
    ctx.lineTo(p2.x - arrowLen*Math.cos(ang-0.42), p2.y - arrowLen*Math.sin(ang-0.42));
    ctx.moveTo(p2.x,p2.y);
    ctx.lineTo(p2.x - arrowLen*Math.cos(ang+0.42), p2.y - arrowLen*Math.sin(ang+0.42));
    ctx.stroke();
}

function redraw(){
    drawCourt();
    ctx.lineWidth=3*scale;
    ctx.strokeStyle="#ffffff";
    for(let arr of savedArrows){
        drawArrowLine(arr.s,arr.e);
    }
    if(arrowStart && tempArrowEnd){
        ctx.strokeStyle="#ffdd33";
        drawArrowLine(arrowStart,tempArrowEnd);
    }
    for(let pl of playerList){
        ctx.beginPath();
        const r=19*scale;
        ctx.arc(pl.x,pl.y,r,0,Math.PI*2);
        ctx.fillStyle = pl.color;
        ctx.fill();
        ctx.strokeStyle="#fff";
        ctx.stroke();

        ctx.fillStyle="#ffffff";
        ctx.font = "bold "+(20*scale)+"px Arial, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.strokeStyle="#000000";
        ctx.lineWidth=2*scale;
        ctx.strokeText(String(pl.num), pl.x, pl.y);
        ctx.fillText(String(pl.num), pl.x, pl.y);
    }
}

//坐标兼容鼠标、触屏
function getPos(e){
    const rect = canvas.getBoundingClientRect();
    let clientX,clientY;
    if(e.touches){
        clientX=e.touches[0].clientX;
        clientY=e.touches[0].clientY;
    }else{
        clientX=e.clientX;
        clientY=e.clientY;
    }
    return {
        x: clientX - rect.left,
        y: clientY - rect.top
    }
}

function pointerDown(e){
    e.preventDefault();
    let pos = getPos(e);
    const mx = pos.x;
    const my = pos.y;
    dragTarget=null;
    const r=19*scale;
    for(let p of playerList){
        let dx = mx-p.x;
        let dy = my-p.y;
        if(dx*dx+dy*dy < r*r){
            dragTarget=p;
            return;
        }
    }
    arrowStart = {x:mx,y:my};
    tempArrowEnd = {x:mx,y:my};
}

function pointerMove(e){
    e.preventDefault();
    let pos = getPos(e);
    const mx = pos.x;
    const my = pos.y;
    if(dragTarget){
        dragTarget.x=mx;
        dragTarget.y=my;
        redraw();
        return;
    }
    if(arrowStart){
        tempArrowEnd={x:mx,y:my};
        redraw();
    }
}

function pointerUp(e){
    e.preventDefault();
    if(dragTarget){
        dragTarget=null;
        return;
    }
    if(arrowStart && tempArrowEnd){
        savedArrows.push({s:arrowStart,e:tempArrowEnd});
    }
    arrowStart=null;
    tempArrowEnd=null;
    redraw();
}

//绑定事件
canvas.addEventListener("mousedown",pointerDown);
canvas.addEventListener("mousemove",pointerMove);
canvas.addEventListener("mouseup",pointerUp);
canvas.addEventListener("touchstart",pointerDown);
canvas.addEventListener("touchmove",pointerMove);
canvas.addEventListener("touchend",pointerUp);


//按钮
document.getElementById("btnReset").onclick = function(){
    playerBase = JSON.parse(JSON.stringify(originBase));
    resizeCanvas();
};
document.getElementById("btnClearArrow").onclick = function(){
    savedArrows=[];
    redraw();
};
document.getElementById("btnT1").onclick = function(){
    playerBase[0].x = 280;
    playerBase[0].y = 920;
    resizeCanvas();
};
document.getElementById("btnT2").onclick = function(){
    playerBase[1].x = 140; playerBase[1].y = 840;
    playerBase[2].x = 420; playerBase[2].y = 840;
    resizeCanvas();
};
document.getElementById("btnT3").onclick = function(){
    playerBase[3].x = 160; playerBase[3].y = 600;
    playerBase[4].x = 400; playerBase[4].y = 600;
    resizeCanvas();
};

window.addEventListener('resize',resizeCanvas);

resizeCanvas();
</script>
</body>
</html>
